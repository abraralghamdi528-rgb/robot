<!-- header.html: HTML + CSS + JavaScript -->

<style>
  .nx-header {
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    color: #f6f7fa;
    background: rgba(8, 12, 20, 0.96);
    border-bottom: 1px solid rgba(159, 190, 255, 0.16);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    font-family: Arial, Helvetica, sans-serif;
  }

  .nx-header * {
    box-sizing: border-box;
  }

  .nx-header a {
    color: inherit;
    text-decoration: none;
  }

  .nx-nav {
    width: 100%;
    max-width: 1280px;
    min-height: 98px;
    margin: 0 auto;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
  }

  /* Logo */

  .nx-logo {
    display: inline-flex;
    align-items: center;
    gap: 15px;
    flex-shrink: 0;
  }

  .nx-logo-circle {
    position: relative;
    display: block;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 50%;
    background: #101d33;
    border: 1px solid #7698d3;
    box-shadow:
      0 0 0 5px rgba(111, 151, 220, 0.05),
      0 6px 18px rgba(0, 0, 0, 0.25);
    transition:
      border-color 0.25s ease,
      box-shadow 0.25s ease,
      transform 0.25s ease;
  }

  .nx-logo-circle img {
    position: absolute;
    top: 7%;
    left: 3%;
    display: block;
    height: 86%;
    width: auto;
    max-width: none;
  }

  .nx-logo:hover .nx-logo-circle {
    transform: translateY(-2px);
    border-color: #c5d8ff;
    box-shadow:
      0 0 0 5px rgba(111, 151, 220, 0.09),
      0 8px 22px rgba(0, 0, 0, 0.3);
  }

  .nx-logo-text {
    display: flex;
    flex-direction: column;
    gap: 6px;
    line-height: 1;
  }

  .nx-logo-name {
    color: #f6f7fa;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 4px;
  }

  .nx-logo-subtitle {
    color: #a9bfdf;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 5px;
  }

  /* Navigation */

  .nx-links {
    display: flex;
    align-items: center;
    gap: 30px;
  }

  .nx-links > a {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: #b1bed1;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    transition: color 0.2s ease;
  }

  .nx-links > a:hover {
    color: #ffffff;
  }

  .nx-links > a:not(.nx-contact)::after {
    position: absolute;
    right: 0;
    bottom: 5px;
    left: 0;
    height: 1px;
    background: #9fbeff;
    content: "";
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s ease;
  }

  .nx-links > a:not(.nx-contact):hover::after {
    transform: scaleX(1);
  }

  .nx-links > .nx-contact {
    justify-content: center;
    gap: 15px;
    padding: 12px 19px;
    color: #f6f7fa;
    background: #162c4e;
    border: 1px solid #486a9f;
    border-radius: 5px;
    transition:
      background 0.2s ease,
      border-color 0.2s ease;
  }

  .nx-links > .nx-contact:hover {
    background: #203d68;
    border-color: #92b3ed;
  }

  .nx-contact-arrow {
    color: #bed3ff;
    font-size: 17px;
  }

  /* Mobile menu */

  .nx-menu {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 92px;
    min-height: 44px;
    padding: 10px 13px;
    color: #f6f7fa;
    background: #111e32;
    border: 1px solid #435a7e;
    border-radius: 5px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  .nx-menu-symbol {
    font-size: 20px;
    line-height: 1;
  }

  .nx-header :focus-visible {
    outline: 2px solid #b9d0ff;
    outline-offset: 5px;
  }

  @media (max-width: 800px) {
    .nx-nav {
      min-height: 86px;
      padding: 15px 22px;
      flex-wrap: wrap;
      gap: 18px;
    }

    .nx-logo {
      gap: 12px;
    }

    .nx-logo-circle {
      width: 54px;
      height: 54px;
    }

    .nx-logo-name {
      font-size: 20px;
      letter-spacing: 3px;
    }

    .nx-logo-subtitle {
      font-size: 9px;
      letter-spacing: 4px;
    }

    .nx-menu {
      display: inline-flex;
    }

    .nx-links {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding-top: 10px;
      padding-bottom: 5px;
      border-top: 1px solid rgba(159, 190, 255, 0.15);
    }

    .nx-links.is-open {
      display: flex;
    }

    .nx-links > a {
      min-height: 50px;
      padding: 13px 4px;
      font-size: 14px;
    }

    .nx-links > a:not(.nx-contact)::after {
      display: none;
    }

    .nx-links > .nx-contact {
      margin-top: 10px;
      padding: 13px 18px;
    }
  }

  @media (max-width: 380px) {
    .nx-nav {
      padding-right: 16px;
      padding-left: 16px;
      gap: 12px;
    }

    .nx-logo {
      gap: 9px;
    }

    .nx-logo-circle {
      width: 46px;
      height: 46px;
    }

    .nx-logo-name {
      font-size: 17px;
      letter-spacing: 2px;
    }

    .nx-logo-subtitle {
      font-size: 8px;
      letter-spacing: 3px;
    }

    .nx-menu {
      min-width: 76px;
      padding: 9px;
      gap: 7px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .nx-header *,
    .nx-header *::before,
    .nx-header *::after {
      transition: none !important;
    }
  }
</style>

<header class="nx-header">
  <nav class="nx-nav" aria-label="Main navigation">

    <a
      href="./index.html"
      class="nx-logo"
      aria-label="Nexus Robotics home"
    >
      <span class="nx-logo-circle" aria-hidden="true">
        <img
          src="./media/nexus-robotics-logo.png"
          alt=""
          decoding="async"
        >
      </span>

      <span class="nx-logo-text">
        <span class="nx-logo-name">NEXUS</span>
        <span class="nx-logo-subtitle">ROBOTICS</span>
      </span>
    </a>

    <button
      type="button"
      class="nx-menu"
      aria-expanded="false"
      aria-controls="nx-navigation"
      aria-label="Open navigation menu"
    >
      <span class="nx-menu-label">Menu</span>
      <span class="nx-menu-symbol" aria-hidden="true">+</span>
    </button>

    <div class="nx-links" id="nx-navigation">
      <a href="./index.html#collection">Robots</a>

      <a href="./index.html#applications">Applications</a>

      <a href="./index.html#approach">Our approach</a>

      <a href="./contact.html" class="nx-contact">
        Contact Us
        <span class="nx-contact-arrow" aria-hidden="true">↗</span>
      </a>
    </div>

  </nav>
</header>

<script>
(() => {
  const header = document.querySelector('.nx-header');

  if (!header) return;

  const menu = header.querySelector('.nx-menu');
  const links = header.querySelector('.nx-links');
  const menuLabel = menu.querySelector('.nx-menu-label');
  const menuSymbol = menu.querySelector('.nx-menu-symbol');
  const desktop = window.matchMedia('(min-width: 801px)');

  function setMenu(open) {
    links.classList.toggle('is-open', open);

    menu.setAttribute('aria-expanded', String(open));

    menu.setAttribute(
      'aria-label',
      open ? 'Close navigation menu' : 'Open navigation menu'
    );

    menuLabel.textContent = open ? 'Close' : 'Menu';
    menuSymbol.textContent = open ? '−' : '+';
  }

  menu.addEventListener('click', () => {
    const open = menu.getAttribute('aria-expanded') !== 'true';

    setMenu(open);
  });

  links.addEventListener('click', event => {
    if (event.target.closest('a')) {
      setMenu(false);
    }
  });

  header.addEventListener('keydown', event => {
    if (
      event.key === 'Escape' &&
      menu.getAttribute('aria-expanded') === 'true'
    ) {
      setMenu(false);
      menu.focus();
    }
  });

  document.addEventListener('click', event => {
    if (
      !header.contains(event.target) &&
      menu.getAttribute('aria-expanded') === 'true'
    ) {
      setMenu(false);
    }
  });

  desktop.addEventListener('change', event => {
    if (event.matches) {
      setMenu(false);
    }
  });
})();
</script>
